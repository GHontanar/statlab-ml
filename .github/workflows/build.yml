name: Build

# Paquetes de escritorio con PyInstaller (onedir) para Windows, Linux y macOS.
# - Al publicar una etiqueta v* se adjuntan a la Release de GitHub.
# - También se puede lanzar a mano; si se indica «version» (p. ej. v0.1.0), crea esa
#   etiqueta sobre el commit compilado y publica la Release con los paquetes.
# - Corre también cuando cambia el empaquetado (sin publicar nada).
on:
  push:
    tags: ["v*"]  # en las etiquetas no se aplica el filtro de rutas
    branches: ["**"]
    paths: ["packaging/**", ".github/workflows/build.yml", "src/statlab/selftest.py"]
  workflow_dispatch:
    inputs:
      version:
        description: "Etiqueta de la versión a publicar (p. ej. v0.1.0). Vacío = solo compilar."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Paquete (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04  # glibc antigua: el paquete funciona en más distribuciones
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Librerías de sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0

      - name: Instalar dependencias
        run: uv sync --locked --group build

      - name: Versión
        id: version
        shell: bash
        run: echo "version=$(uv run python -c 'import statlab; print(statlab.__version__)')" >> "$GITHUB_OUTPUT"

      - name: PyInstaller
        run: uv run pyinstaller packaging/statlab.spec --noconfirm

      # El ejecutable empaquetado (sin Python instalado detrás) hace el análisis completo
      # con los datos de ejemplo y exporta todos los formatos.
      - name: Autocomprobación (Linux)
        if: runner.os == 'Linux'
        run: |
          ./dist/StatLab/StatLab --self-test selftest.txt || (cat selftest.txt; exit 1)
          cat selftest.txt
      - name: Autocomprobación (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/StatLab.app/Contents/MacOS/StatLab --self-test "$PWD/selftest.txt" || (cat selftest.txt; exit 1)
          cat selftest.txt
      - name: Autocomprobación (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "dist\StatLab\StatLab.exe" -ArgumentList "--self-test", "`"$out`"" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Empaquetar (Windows, zip portable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item packaging\LEEME.txt dist\StatLab\LEEME.txt
          Compress-Archive -Path dist\StatLab -DestinationPath "StatLab-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip"
      - name: Empaquetar (Linux, tar.gz con acceso directo)
        if: runner.os == 'Linux'
        run: |
          cp packaging/LEEME.txt packaging/linux/statlab.desktop packaging/linux/statlab.png \
             packaging/linux/instalar-acceso-directo.sh dist/StatLab/
          tar czf "StatLab-${{ steps.version.outputs.version }}-${{ matrix.platform }}.tar.gz" -C dist StatLab
      - name: Empaquetar (macOS, .app en zip)
        if: runner.os == 'macOS'
        run: |
          cp packaging/LEEME.txt dist/LEEME.txt
          ditto -c -k --keepParent dist/StatLab.app "StatLab-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip"
          (cd dist && zip -q "../StatLab-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip" LEEME.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: StatLab-${{ matrix.platform }}
          path: |
            StatLab-*.zip
            StatLab-*.tar.gz
          if-no-files-found: error

  release:
    name: Adjuntar a la Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: StatLab ${{ inputs.version || github.ref_name }}
          files: paquetes/*
          generate_release_notes: true
