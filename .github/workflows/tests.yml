name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Librerías de sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Ruff
        if: runner.os == 'Linux'
        run: uv run ruff check src tests

      - name: Pytest
        run: uv run pytest -q
        env:
          STATLAB_CAPTURAS: capturas

      - name: Subir capturas de pantalla
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas/
          if-no-files-found: ignore
