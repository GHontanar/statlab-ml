[project]
name = "statlab"
version = "0.2.0"
description = "StatLab: análisis estadístico clínico de escritorio (módulo k-means)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Solo los módulos esenciales de Qt (sin QtWebEngine): mucho más ligero.
    "PySide6-Essentials>=6.7",
    "pyqtgraph>=0.13.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "python-docx>=1.1",
]

[project.gui-scripts]
statlab = "statlab.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["prototipo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
